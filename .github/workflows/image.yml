# Builds the Hullproof Action image for linux/amd64 and linux/arm64 and pushes it as one multi platform image to ghcr.io.
# It runs only when started by hand (gh workflow run image.yml). It uses the workflow token with packages write and no other
# credential. Every third party action is pinned by commit SHA, with the release in a trailing comment. The base image is pinned by
# digest in the Dockerfile, and the Dockerfile checks the npm integrity of the engine before it installs it.
name: image
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/jt247/hullproof-action:0.5.0
          labels: |
            org.opencontainers.image.source=https://github.com/jt247/hullproof-action
            org.opencontainers.image.version=0.5.0
            org.opencontainers.image.licenses=Apache-2.0
      - name: Show the manifest list
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
          docker buildx imagetools inspect ghcr.io/jt247/hullproof-action:0.5.0
